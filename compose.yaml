name: aep-raizes-console
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: raizes_console
      MYSQL_USER: raizes
      MYSQL_PASSWORD: ${DB_PASSWORD:?Execute configurar.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute configurar.ps1}
    volumes:
      - dados-console:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  dados-console:
